    async function compressAndUploadImage(file, uid, prefix) {
      const imgUrl = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = reject;
          i.src = imgUrl;
        });
        const maxSide = 720;
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.82));
        const path = `${uid}/${prefix}-${Date.now()}.jpg`;
        const { error: upErr } = await supabase.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
        if (upErr) throw upErr;
        const { data } = supabase.storage.from('avatars').getPublicUrl(path);
        return data.publicUrl;
      } finally {
        URL.revokeObjectURL(imgUrl);
      }
    }

    function computeCompatibility(me, them, weights) {
      const sum = weights.location_budget_weight + weights.sleep_weight + weights.cleanliness_weight + weights.smoking_pets_weight || 100;
      const wLoc = (weights.location_budget_weight / sum) * 100, wSleep = (weights.sleep_weight / sum) * 100;
      const wClean = (weights.cleanliness_weight / sum) * 100, wSP = (weights.smoking_pets_weight / sum) * 100;
      let locRatio = me.city === them.city ? (me.locality === them.locality ? 0.55 : 0.45) : 0.1;
      const overlapMin = Math.max(me.min_budget, them.min_budget), overlapMax = Math.min(me.max_budget, them.max_budget);
      locRatio += overlapMax >= overlapMin ? 0.45 : (overlapMin - overlapMax <= 4000 ? 0.25 : 0.05);
      const sleepRatio = me.sleep_schedule === them.sleep_schedule ? 1 : (me.sleep_schedule.includes('Balanced') || them.sleep_schedule.includes('Balanced') ? 0.72 : 0.35);
      const cleanRatio = me.cleaning_habit === them.cleaning_habit ? 1 : (me.cleaning_habit.includes('Daily') && them.cleaning_habit.includes('Weekend') ? 0.4 : 0.75);
      const smokePts = me.smoking_habit === them.smoking_habit ? 0.5 : (me.smoking_habit === 'No Smoking' && them.smoking_habit === 'Smoker Friendly' ? 0.1 : 0.32);
      const petConflict = (me.pet_preference.startsWith('Has a') && them.pet_preference === 'No Pets') || (them.pet_preference.startsWith('Has a') && me.pet_preference === 'No Pets');
      const petPts = me.pet_preference === them.pet_preference ? 0.5 : (petConflict ? 0.1 : 0.42);
      const totalScore = Math.max(25, Math.min(99, Math.round(locRatio * wLoc + sleepRatio * wSleep + cleanRatio * wClean + (smokePts + petPts) * wSP)));
      const frictions = [];
      if (me.city !== them.city) frictions.push(`Different target cities (${me.city} vs ${them.city})`);
      if (sleepRatio < 0.5) frictions.push(`Sleep clash (${me.sleep_schedule} vs ${them.sleep_schedule})`);
      if (cleanRatio < 0.6) frictions.push(`Cleanliness gap (${me.cleaning_habit} vs ${them.cleaning_habit})`);
      if (petConflict) frictions.push(`Pet preference conflict (${me.pet_preference} vs ${them.pet_preference})`);
      if (smokePts < 0.2) frictions.push(`Smoking policy conflict (${me.smoking_habit} vs ${them.smoking_habit})`);
      return { totalScore, frictions };
    }

    function buildVibeQuestions(me, them, frictions) {
      const qs = [];
      if (me.sleep_schedule !== them.sleep_schedule) qs.push(`Since you are "${me.sleep_schedule}" and they are "${them.sleep_schedule}", how will you handle calls or kitchen noise after 11 PM?`);
      else qs.push('How do you want to split recurring expenses like cook, maid, RO water, and WiFi?');
      if (them.pet_preference.startsWith('Has a')) qs.push(`How will pet care and society pet permissions be managed for their ${them.pet_preference.replace('Has a ', '')}?`);
      else qs.push('What are your boundaries around weekend guests, house parties, and WFH calls?');
      qs.push('Before signing the 11-month agreement, how will you split the security deposit and handle early exit notice?');
      return { frictions: frictions.length ? frictions : ['No major lifestyle clashes — confirm guest & cook split rules.'], questions: qs };
    }

            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <div><label className="block text-[11px] text-[#9E9E9E] mb-1">City</label><select value={city} onChange={(e) => { setCity(e.target.value); setLocality(INDIAN_CITIES[e.target.value][0]); }} className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-[#C0C0C0]/30 text-xs text-white">{CITY_LIST.map((c) => <option key={c}>{c}</option>)}</select></div>
              <div>
                <label className="block text-[11px] text-[#9E9E9E] mb-1">Locality</label>
                <select value={locality} onChange={(e) => setLocality(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-[#C0C0C0]/30 text-xs text-white">
                  {INDIAN_CITIES[city].map((l) => <option key={l}>{l}</option>)}
                  <option value="__OTHER__">Other (Type Area)</option>
                </select>
              </div>
            </div>
            {locality === '__OTHER__' && (
              <input required placeholder={`Type your area in ${city}`} value={customLocality} onChange={(e) => setCustomLocality(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-[#FF6B00] text-xs text-white" />
            )}
            <div>
              <label className="block text-[11px] text-[#9E9E9E] mb-1">Monthly Budget: ₹{Number(minBudget).toLocaleString('en-IN')} – ₹{Number(maxBudget).toLocaleString('en-IN')}</label>
              <div className="grid grid-cols-2 gap-3">
                <input type="range" min="8000" max="30000" step="1000" value={minBudget} onChange={(e) => setMinBudget(Number(e.target.value))} />
                <input type="range" min="12000" max="40000" step="1000" value={maxBudget} onChange={(e) => setMaxBudget(Math.max(minBudget + 2000, Number(e.target.value)))} />
              </div>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <select value={sleepSchedule} onChange={(e) => setSleepSchedule(e.target.value)} className="px-3.5 py-2.5 rounded-xl bg-black border border-[#C0C0C0]/30 text-xs text-white"><option>Early Bird by 11 PM</option><option>Balanced 12 AM</option><option>Night Owl 2 AM+</option></select>
              <select value={cleaningHabit} onChange={(e) => setCleaningHabit(e.target.value)} className="px-3.5 py-2.5 rounded-xl bg-black border border-[#C0C0C0]/30 text-xs text-white"><option>Cleans Daily</option><option>Weekly Maid + Tidy</option><option>Chill / Weekend Clean</option></select>
              <select value={smokingHabit} onChange={(e) => setSmokingHabit(e.target.value)} className="px-3.5 py-2.5 rounded-xl bg-black border border-[#C0C0C0]/30 text-xs text-white"><option>No Smoking</option><option>Social / Balcony Only</option><option>Smoker Friendly</option></select>
              <select value={petPreference} onChange={(e) => setPetPreference(e.target.value)} className="px-3.5 py-2.5 rounded-xl bg-black border border-[#C0C0C0]/30 text-xs text-white"><option>No Pets</option><option>Pet Friendly</option><option>Has a Dog</option><option>Has a Cat</option></select>
            </div>
            <textarea rows="2" value={bio} onChange={(e) => setBio(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-[#C0C0C0]/30 text-xs text-white" />
            <label className="flex items-center gap-2 text-xs text-white cursor-pointer"><input type="checkbox" checked={hasRoom} onChange={(e) => setHasRoom(e.target.checked)} className="accent-[#FF6B00]" />I already have a flat/room shortlisted</label>
            <button type="submit" disabled={saving || uploading} className="w-full py-3 rounded-xl bg-[#FF6B00] hover:bg-[#e56000] text-white text-sm font-extrabold disabled:opacity-60">{saving ? 'Saving Profile...' : 'Launch Discover Deck'}</button>
          </form>
        </div>
      );
    }

    function MainApp({ session, onSignOut }) {
      const uid = session.user.id;
      const [loading, setLoading] = useState(true);
      const [tab, setTab] = useState('discover');
      const [myProfile, setMyProfile] = useState(null);
      const [myPrefs, setMyPrefs] = useState(null);
      const [profiles, setProfiles] = useState([]);
      const [prefsMap, setPrefsMap] = useState({});
      const [swipes, setSwipes] = useState([]);
      const [matches, setMatches] = useState([]);
      const [listings, setListings] = useState([]);
      const [kycQueue, setKycQueue] = useState([]);
      const [weights, setWeights] = useState({ location_budget_weight: 35, sleep_weight: 25, cleanliness_weight: 20, smoking_pets_weight: 20 });

      const [optimisticSwiped, setOptimisticSwiped] = useState([]);
      const [dragX, setDragX] = useState(0);
      const startXRef = useRef(null);
      const chatEndRef = useRef(null);

      const [notifPerm, setNotifPerm] = useState(() => ('Notification' in window ? Notification.permission : 'denied'));
      const [toast, setToast] = useState(null);
      const [unreadCount, setUnreadCount] = useState(0);

      const [cityFilter, setCityFilter] = useState('All');
      const [flatsCityFilter, setFlatsCityFilter] = useState('All');
      const [compareItem, setCompareItem] = useState(null);
      const [vibeOutput, setVibeOutput] = useState(null);
      const [matchPopup, setMatchPopup] = useState(null);
      const [showAccountModal, setShowAccountModal] = useState(false);
      const [uploadingAvatar, setUploadingAvatar] = useState(false);
      const [accountMsg, setAccountMsg] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(false);
      const [deleting, setDeleting] = useState(false);

      const [activeMatchId, setActiveMatchId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [draftMsg, setDraftMsg] = useState('');
      const [showKycModal, setShowKycModal] = useState(false);
      const [kycDocType, setKycDocType] = useState('Aadhaar');
      const [kycDocVal, setKycDocVal] = useState('');
      const [showMeetupModal, setShowMeetupModal] = useState(false);
      const [meetupType, setMeetupType] = useState('Coffee Meetup');
      const [meetupTime, setMeetupTime] = useState('Sunday, 4:00 PM');
      const [meetupLocation, setMeetupLocation] = useState('Local Cafe / Flat Tour');

      const [showFlatForm, setShowFlatForm] = useState(false);
      const [flatTitle, setFlatTitle] = useState('');
      const [flatCity, setFlatCity] = useState('Bengaluru');
      const [flatLocality, setFlatLocality] = useState(INDIAN_CITIES.Bengaluru[0]);
      const [flatCustomLoc, setFlatCustomLoc] = useState('');
      const [flatBhk, setFlatBhk] = useState('2BHK');
      const [flatRent, setFlatRent] = useState(44000);
      const [flatDeposit, setFlatDeposit] = useState(120000);
      const [flatImgUrl, setFlatImgUrl] = useState('');
      const [uploadingFlatImg, setUploadingFlatImg] = useState(false);

      const pushNotification = (title, body, targetTab = 'matches') => {
        setToast({ id: Date.now(), title, body, targetTab });
        fireDeviceNotification(title, body);
        setTimeout(() => setToast((prev) => (prev && Date.now() - prev.id >= 5500 ? null : prev)), 6000);
      };

      const requestNotifPermission = async () => {
        if (!('Notification' in window)) return;
        const perm = await Notification.requestPermission();
        setNotifPerm(perm);
        if (perm === 'granted') pushNotification('Alerts Enabled!', 'You will now get instant notifications for new matches & messages.', tab);
      };

      const loadAll = async () => {
        const [{ data: pData }, { data: prData }, { data: sData }, { data: mData }, { data: lData }, { data: aData }, { data: kData }] = await Promise.all([
          supabase.from('profiles').select('*'),
          supabase.from('lifestyle_preferences').select('*'),
          supabase.from('swipes').select('*').eq('swiper_id', uid),
          supabase.from('matches').select('*').or(`user_a_id.eq.${uid},user_b_id.eq.${uid}`),
          supabase.from('verified_listings').select('*').order('created_at', { ascending: false }),
          supabase.from('algorithm_config').select('*').eq('id', 1).maybeSingle(),
          supabase.from('kyc_verifications').select('*')
        ]);
        const pList = pData || [], prList = prData || [], map = {};
        prList.forEach((r) => { map[r.user_id] = r; });
        setProfiles(pList); setPrefsMap(map);
        setMyProfile(pList.find((p) => p.id === uid) || null);
        setMyPrefs(map[uid] || null);
        setSwipes(sData || []); setMatches(mData || []); setListings(lData || []); setKycQueue(kData || []);
        if (aData) setWeights(aData);
        if (mData && mData.length > 0 && !activeMatchId) setActiveMatchId(mData[0].id);
        setLoading(false);
      };

      useEffect(() => { loadAll(); }, [uid]);

      useEffect(() => {
        const channel = supabase.channel(`global-notifs-${uid}`)
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'matches' }, (payload) => {
            const m = payload.new;
            if (m.user_a_id === uid || m.user_b_id === uid) {
              setUnreadCount((c) => c + 1);
              setActiveMatchId(m.id);
              pushNotification("It's a Flatmate Match!", 'You have a new compatible flatmate match. Tap to start chatting!', 'matches');
              loadAll();
            }
          })
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
            const msg = payload.new;
            if (msg.sender_id !== uid) {
              setUnreadCount((c) => c + 1);
              pushNotification(msg.message_type === 'meetup_invite' ? 'New Meetup Invite' : 'New Flatmate Message', msg.content, 'matches');
              if (activeMatchId === msg.match_id) setMessages((prev) => (prev.some((x) => x.id === msg.id) ? prev : [...prev, msg]));
            }
          })
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles', filter: `id=eq.${uid}` }, (payload) => {
            if (payload.new.is_verified && (!payload.old || !payload.old.is_verified)) {
              pushNotification('ID Verified!', 'You earned the Orange Verified Shield.', 'discover');
              loadAll();
            }
          })
          .subscribe();
        return () => { supabase.removeChannel(channel); };
      }, [uid, activeMatchId]);

      useEffect(() => {
        if (!activeMatchId) return;
        supabase.from('messages').select('*').eq('match_id', activeMatchId).order('created_at', { ascending: true }).then(({ data }) => setMessages(data || []));
      }, [activeMatchId]);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages.length, tab]);

      const discoverFeed = useMemo(() => {
        if (!myPrefs) return [];
        const swipedIds = new Set([...swipes.map((s) => s.target_id), ...optimisticSwiped]);
        return profiles
          .filter((p) => p.id !== uid && !swipedIds.has(p.id) && prefsMap[p.id])
          .filter((p) => cityFilter === 'All' || prefsMap[p.id].city === cityFilter)
          .map((p) => ({ profile: p, prefs: prefsMap[p.id], comp: computeCompatibility(myPrefs, prefsMap[p.id], weights) }))
          .sort((a, b) => (a.profile.is_boosted !== b.profile.is_boosted ? (a.profile.is_boosted ? -1 : 1) : b.comp.totalScore - a.comp.totalScore));
      }, [profiles, prefsMap, swipes, optimisticSwiped, myPrefs, weights, cityFilter, uid]);

      const visibleListings = useMemo(() => {
        return listings.filter((l) => l.status === 'active' && (flatsCityFilter === 'All' || l.city === flatsCityFilter));
      }, [listings, flatsCityFilter]);

      if (loading) return <div className="min-h-screen bg-black flex items-center justify-center"><p className="text-sm font-bold text-[#FF6B00]">Loading Make my Mate...</p></div>;
      if (!myProfile || !myPrefs) return <OnboardingWizard session={session} onCompleted={loadAll} />;

      const handleSwipe = async (target, direction) => {
        if (!target) return;
        setDragX(0);
        setOptimisticSwiped((prev) => [...prev, target.profile.id]);
        await supabase.from('swipes').upsert({ swiper_id: uid, target_id: target.profile.id, direction, compatibility_score: target.comp.totalScore });
        if (direction === 'like' || direction === 'super') {
          const { data: mutual } = await supabase.from('swipes').select('id').eq('swiper_id', target.profile.id).eq('target_id', uid).in('direction', ['like', 'super']).maybeSingle();
          if (mutual) {
            const { data: newMatch } = await supabase.from('matches').insert({ user_a_id: uid, user_b_id: target.profile.id, pipeline_stage: 1 }).select().single();
            if (newMatch) {
              setMatchPopup({ match: newMatch, partner: target });
              setActiveMatchId(newMatch.id);
              fireDeviceNotification("It's a Flatmate Match!", `You and ${target.profile.full_name} matched at ${target.comp.totalScore}%!`);
            }
          }
        }
        loadAll();
      };

      const sendChatMessage = async (content, type = 'text', metadata = {}) => {
        if (!activeMatchId || !content.trim()) return;
        const text = content.trim();
        setDraftMsg('');
        const { data } = await supabase.from('messages').insert({ match_id: activeMatchId, sender_id: uid, content: text, message_type: type, metadata }).select().single();
        if (data) setMessages((prev) => (prev.some((x) => x.id === data.id) ? prev : [...prev, data]));
      };

      const handleUpdateAvatar = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setUploadingAvatar(true); setAccountMsg(null);
        try {
          const url = await compressAndUploadImage(file, uid, 'avatar');
          const { error } = await supabase.from('profiles').update({ avatar_url: url }).eq('id', uid);
          if (error) throw error;
          setAccountMsg('Profile photo updated!');
          loadAll();
        } catch (ex) { setAccountMsg('Upload error: ' + (ex.message || 'Check Storage SQL')); }
        finally { setUploadingAvatar(false); }
      };

      const handleUploadFlatPhoto = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setUploadingFlatImg(true);
        try {
          const url = await compressAndUploadImage(file, uid, 'flat');
          setFlatImgUrl(url);
        } catch (ex) { setToast({ id: Date.now(), title: 'Upload failed', body: ex.message, targetTab: 'flats' }); }
        finally { setUploadingFlatImg(false); }
      };

      const handleDeleteAccount = async () => {
        setDeleting(true); setAccountMsg(null);
        try {
          const { error: rpcErr } = await supabase.rpc('delete_my_account');
          if (rpcErr) {
            const { error: delErr } = await supabase.from('profiles').delete().eq('id', uid);
            if (delErr) throw delErr;
          }
          await supabase.auth.signOut();
          setShowAccountModal(false);
        } catch (ex) { setAccountMsg(ex.message || 'Could not delete account.'); setDeleting(false); }
      };

      const activeMatch = matches.find((m) => m.id === activeMatchId) || matches[0];
      const activePartner = activeMatch ? profiles.find((p) => p.id === (activeMatch.user_a_id === uid ? activeMatch.user_b_id : activeMatch.user_a_id)) : null;
      const isUserA = activeMatch ? activeMatch.user_a_id === uid : true;
      const myConfirmed = activeMatch ? (isUserA ? activeMatch.agreement_confirmed_a : activeMatch.agreement_confirmed_b) : false;
      const partnerConfirmed = activeMatch ? (isUserA ? activeMatch.agreement_confirmed_b : activeMatch.agreement_confirmed_a) : false;

      return (
        <div className="min-h-screen bg-black text-white flex flex-col">
          {toast && (
            <button onClick={() => { setTab(toast.targetTab); setUnreadCount(0); setToast(null); }} className="fixed top-4 right-4 z-50 max-w-xs text-left p-3.5 rounded-2xl bg-[#141414] border-2 border-[#FF6B00] shadow-2xl space-y-1 transition-all">
              <div className="flex items-center justify-between gap-2"><span className="text-xs font-extrabold text-[#FF6B00]">{toast.title}</span><span className="text-[10px] text-[#9E9E9E]">Tap to open</span></div>
              <p className="text-xs text-white line-clamp-2">{toast.body}</p>
            </button>
          )}

          <header className="sticky top-0 z-40 bg-[#0D0D0D]/95 backdrop-blur border-b border-[#C0C0C0]/20">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
              <BrandLogo size={36} subtitle="Compatible Flatmates Before Signing" />
              <div className="flex items-center gap-2">
                <button onClick={requestNotifPermission} title="Notifications" className={`relative p-2 rounded-xl border text-xs font-bold flex items-center gap-1 ${notifPerm === 'granted' ? 'bg-[#141414] border-[#C0C0C0]/25 text-[#FF6B00]' : 'bg-[#FF6B00] border-[#FF6B00] text-white'}`}>
                  <SvgIcon name="bell" className="w-4 h-4" />
                  {notifPerm !== 'granted' && <span className="hidden sm:inline text-[11px]">Enable Alerts</span>}
                  {unreadCount > 0 && <span className="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-white text-black text-[10px] font-extrabold flex items-center justify-center">{unreadCount}</span>}
                </button>
                {myProfile.role === 'admin' && (
                  <button onClick={() => setTab(tab === 'admin' ? 'discover' : 'admin')} className={`px-3 py-1.5 rounded-full text-xs font-bold border ${tab === 'admin' ? 'bg-[#FF6B00] border-[#FF6B00] text-white' : 'bg-[#141414] border-[#C0C0C0]/30 text-white'}`}>
                    {tab === 'admin' ? 'User App' : 'Admin'}
                  </button>
                )}
                <button onClick={() => { setShowAccountModal(true); setConfirmDelete(false); setAccountMsg(null); }} className="flex items-center gap-1.5 px-2 py-1 rounded-xl bg-[#141414] border border-[#C0C0C0]/25 hover:border-[#FF6B00] text-xs font-bold text-white">
                  <img src={myProfile.avatar_url || DEFAULT_AVATAR} className="w-6 h-6 rounded-full object-cover" />
                  <span className="hidden sm:inline">{myProfile.full_name}</span>
                </button>
                <button onClick={onSignOut} title="Sign Out" className="p-2 rounded-xl bg-[#141414] border border-[#C0C0C0]/25 text-[#C0C0C0] hover:text-white hover:border-[#FF6B00]"><SvgIcon name="logout" className="w-4 h-4" /></button>
              </div>
            </div>
            {tab !== 'admin' && (
              <div className="max-w-7xl mx-auto px-4 pb-2.5 flex items-center gap-2 overflow-x-auto">
                {[
                  { id: 'discover', label: 'Discover', icon: 'flame', count: discoverFeed.length },
                  { id: 'matches', label: '4-Stage Chat', icon: 'chat', count: matches.length, badge: unreadCount },
                  { id: 'flats', label: 'Verified Flats', icon: 'building', count: listings.filter((l) => l.status === 'active').length },
                ].map((item) => (
                  <button key={item.id} onClick={() => { setTab(item.id); if (item.id === 'matches') setUnreadCount(0); }} className={`flex items-center gap-2 px-4 py-2 rounded-full text-xs font-extrabold whitespace-nowrap transition ${tab === item.id ? 'bg-[#FF6B00] text-white' : 'bg-[#141414] border border-[#C0C0C0]/25 text-[#C0C0C0]'}`}>
                    <SvgIcon name={item.icon} className="w-3.5 h-3.5" /><span>{item.label}</span>
                    <span className="px-1.5 py-0.5 rounded-full bg-black/40 text-[10px]">{item.badge > 0 ? `${item.badge} new` : item.count}</span>
                  </button>
                ))}
              </div>
            )}
          </header>

          {tab === 'discover' && (
            <main className="max-w-5xl mx-auto w-full px-4 py-6">
              <div className="space-y-3 mb-5">
                <div><h2 className="text-xl font-extrabold">Discover Compatible Flatmates</h2><p className="text-xs text-[#9E9E9E]">Drag card right to Match or left to Pass</p></div>
                <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
                  {['All', ...CITY_LIST].map((c) => (
                    <button key={c} onClick={() => setCityFilter(c)} className={`px-3 py-1 rounded-full text-xs font-bold border whitespace-nowrap ${cityFilter === c ? 'bg-[#FF6B00] border-[#FF6B00] text-white' : 'bg-[#141414] border-[#C0C0C0]/25 text-[#C0C0C0]'}`}>{c}</button>
                  ))}
                </div>
              </div>
              <div className="max-w-md mx-auto">
                {discoverFeed[0] ? (
                  <div>
                    <div
                      onPointerDown={(e) => { startXRef.current = e.clientX; }}
                      onPointerMove={(e) => { if (startXRef.current !== null) setDragX(e.clientX - startXRef.current); }}
                      onPointerUp={() => { if (startXRef.current === null) return; if (dragX > 90) handleSwipe(discoverFeed[0], 'like'); else if (dragX < -90) handleSwipe(discoverFeed[0], 'pass'); else setDragX(0); startXRef.current = null; }}
                      onPointerLeave={() => { startXRef.current = null; setDragX(0); }}
                      style={{ transform: `translateX(${dragX}px) rotate(${dragX * 0.035}deg)`, transition: startXRef.current === null ? 'transform 0.22s ease' : 'none' }}
                      className={`relative rounded-3xl bg-[#0D0D0D] overflow-hidden shadow-2xl select-none touch-pan-y ${discoverFeed[0].profile.is_boosted ? 'border-2 border-[#FF6B00]' : 'border border-[#C0C0C0]/30'}`}
                    >
                      {dragX > 35 && <div className="absolute top-6 left-6 z-20 px-4 py-1.5 rounded-xl bg-[#FF6B00] text-white font-extrabold text-sm">MATCH</div>}
                      {dragX < -35 && <div className="absolute top-6 right-6 z-20 px-4 py-1.5 rounded-xl bg-black border border-white text-white font-extrabold text-sm">PASS</div>}
                      <div className="relative h-80 bg-[#141414]">
                        <img src={discoverFeed[0].profile.avatar_url || DEFAULT_AVATAR} alt={discoverFeed[0].profile.full_name} draggable={false} className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-transparent" />
                        <div className="absolute top-4 inset-x-4 flex justify-between items-center">
                          <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#FF6B00] text-white text-xs font-extrabold"><SvgIcon name="flame" className="w-3.5 h-3.5" />{discoverFeed[0].comp.totalScore}% Match</span>
                          {discoverFeed[0].profile.is_verified && <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-black/90 border border-[#FF6B00] text-white text-[11px] font-bold"><SvgIcon name="shield" className="w-3.5 h-3.5 text-[#FF6B00]" />Verified</span>}
                        </div>
                        <div className="absolute bottom-4 inset-x-5">
                          <div className="flex justify-between items-end">
                            <div><h3 className="text-2xl font-extrabold">{discoverFeed[0].profile.full_name}, {discoverFeed[0].profile.age}</h3><p className="text-xs text-[#C0C0C0]">{discoverFeed[0].profile.occupation}</p></div>
                            <span className="px-2.5 py-1 rounded-lg bg-white text-black text-xs font-extrabold">₹{Math.round(discoverFeed[0].prefs.min_budget / 1000)}K–₹{Math.round(discoverFeed[0].prefs.max_budget / 1000)}K</span>
                          </div>
                          <p className="flex items-center gap-1.5 mt-2 text-xs text-white"><SvgIcon name="pin" className="w-3.5 h-3.5 text-[#FF6B00]" />{discoverFeed[0].prefs.locality}, {discoverFeed[0].prefs.city}</p>
                        </div>
                      </div>
                      <div className="p-5 space-y-4">
                        <p className="text-xs text-[#C0C0C0]">{discoverFeed[0].profile.bio}</p>
                        <div className="flex flex-wrap gap-2">
                          {[discoverFeed[0].prefs.sleep_schedule, discoverFeed[0].prefs.cleaning_habit, discoverFeed[0].prefs.smoking_habit, discoverFeed[0].prefs.pet_preference].map((pill) => (
                            <span key={pill} className="px-2.5 py-1 rounded-full bg-[#141414] border border-[#C0C0C0]/25 text-[11px] font-semibold">{pill}</span>
                          ))}
                        </div>
