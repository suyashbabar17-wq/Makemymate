    async function compressAndUploadImage(file, uid, prefix) {
      const imgUrl = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = imgUrl; });
        const scale = Math.min(1, 900 / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.82));
        const path = `${uid}/${prefix}-${Date.now()}.jpg`;
        const { error: upErr } = await supabase.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
        if (upErr) throw upErr;
        return supabase.storage.from('avatars').getPublicUrl(path).data.publicUrl;
      } finally { URL.revokeObjectURL(imgUrl); }
    }
