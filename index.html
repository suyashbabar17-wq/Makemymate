    async function compressAndUploadImage(file, uid, prefix) {
      const imgUrl = URL.createObjectURL(file);
      try {
        const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = imgUrl; });
        const scale = Math.min(1, 900 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.82));
        const path = `${uid}/${prefix}-${Date.now()}.jpg`;
        const { error } = await supabase.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
        if (error) throw error;
        return supabase.storage.from('avatars').getPublicUrl(path).data.publicUrl;
      } finally { URL.revokeObjectURL(imgUrl); }
    }

    async function fireDeviceNotification(title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      try {
        if ('serviceWorker' in navigator) {
          const reg = await navigator.serviceWorker.ready;
          if (reg && reg.showNotification) { await reg.showNotification(title, { body, icon: 'icon-192.png', badge: 'icon-192.png' }); return; }
        }
        new Notification(title, { body, icon: 'icon-192.png' });
      } catch (err) {}
    }
